<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Shows | TheatreBooking</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="container">
            <h1 class="logo">TheatreBooking Admin</h1>

            <nav>
                <a href="admin-dashboard.html">Dashboard</a>
                <a href="#" id="logout-btn">Logout</a>
            </nav>
        </div>
    </header>

    <main class="admin-shows-page">

        <section class="admin-show-form-section">

            <h2 id="form-title">Add New Show</h2>

            <form id="show-form">

                <input
                    type="hidden"
                    id="show-id"
                >

                <div class="form-group">
                    <label for="show-title">
                        Show Title
                    </label>

                    <input
                        type="text"
                        id="show-title"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="show-description">
                        Description
                    </label>

                    <textarea
                        id="show-description"
                        rows="4"
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="show-date">
                        Show Date
                    </label>

                    <input
                        type="date"
                        id="show-date"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="show-time">
                        Show Time
                    </label>

                    <input
                        type="time"
                        id="show-time"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="show-price">
                        Ticket Price
                    </label>

                    <input
                        type="number"
                        id="show-price"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="book-btn"
                    id="save-show-btn"
                >
                    Add Show
                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancel-edit-btn"
                    style="display: none;"
                >
                    Cancel Edit
                </button>

                <p id="show-message"></p>

            </form>

        </section>

        <section class="admin-show-list-section">

            <h2>Existing Shows</h2>

            <div id="admin-shows-container">

                <p>Loading shows...</p>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Theatre Ticket Booking System</p>
    </footer>

    <script src="js/admin-shows.js"></script>

</body>
</html>
