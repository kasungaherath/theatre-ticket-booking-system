<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Theatre Ticket Booking</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="container">
            <h1 class="logo">TheatreBooking</h1>

            <nav>
                <a href="index.html">Home</a>
                <a href="#shows">Shows</a>
            </nav>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="hero-content">
                <h2>Book Your Theatre Experience</h2>

                <p>
                    Discover upcoming shows, choose your seats,
                    and reserve your tickets online.
                </p>

                <a href="#shows" class="btn">View Shows</a>
            </div>
        </section>

        <section id="shows" class="shows-section">

            <h2>Available Shows</h2>

            <p class="section-description">
                Browse our upcoming theatre shows.
            </p>

            <div id="shows-container" class="shows-container">

                <p>Shows will appear here.</p>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Theatre Ticket Booking System</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
