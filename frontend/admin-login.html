<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | TheatreBooking</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="container">
            <h1 class="logo">TheatreBooking</h1>

            <nav>
                <a href="index.html">Home</a>
            </nav>
        </div>
    </header>

    <main class="admin-login-page">

        <section class="admin-login-box">

            <h2>Admin Login</h2>

            <p class="section-description">
                Sign in to manage theatre shows and bookings.
            </p>

            <form id="admin-login-form">

                <div class="form-group">

                    <label for="admin-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="admin-email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="admin-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="admin-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="book-btn"
                >
                    Login
                </button>

                <p
                    id="login-message"
                    class="login-message"
                ></p>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Theatre Ticket Booking System</p>
    </footer>

    <script src="js/admin-login.js"></script>

</body>
</html>
